<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heliotrope - The Ultimate Apple Internal Hub</title>
    <style>
        /* Фирменная глубокая фиолетовая палитра */
        :root {
            --bg-color: #0b0713;
            --card-bg: #160f24;
            --card-hover: #221636;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --border-color: rgba(139, 92, 246, 0.15);
            --border-hover: rgba(139, 92, 246, 0.45);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --footer-bg: #0d0818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Интегрированная плавная анимация появления (Fade In + 30px) */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px 48px 20px;
            max-width: 800px;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
            animation-delay: 0.2s;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #8b5cf6, #3b0764);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Контейнер контента */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin-bottom: 60px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        /* Карточки */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            min-height: 140px;
            opacity: 0;
            will-change: transform, opacity;
            transition: background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Каскадное появление основных карточек */
        #main-grid .card:nth-child(1) { animation: fadeIn 1.5s forwards; animation-delay: 0.3s; }
        #main-grid .card:nth-child(2) { animation: fadeIn 1.5s forwards; animation-delay: 0.36s; }
        #main-grid .card:nth-child(3) { animation: fadeIn 1.5s forwards; animation-delay: 0.42s; }
        #main-grid .card:nth-child(4) { animation: fadeIn 1.5s forwards; animation-delay: 0.48s; }
        #main-grid .card:nth-child(5) { animation: fadeIn 1.5s forwards; animation-delay: 0.54s; }
        #main-grid .card:nth-child(6) { animation: fadeIn 1.5s forwards; animation-delay: 0.6s; }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 25px var(--accent-glow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 32px;
        }

        .icon-wrapper {
            background: rgba(139, 92, 246, 0.08);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .card:hover .icon-wrapper {
            transform: scale(1.04);
        }

        .arrow-icon {
            color: var(--accent-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
        }

        .card:hover .arrow-icon {
            color: #d8b4fe;
            transform: translateX(5px);
            filter: drop-shadow(0 0 8px var(--accent-color));
        }

        .card-content h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 16px;
        }

        /* Подвал */
        footer {
            margin-top: auto;
            width: 100%;
            padding: 48px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background-color: var(--footer-bg);
            opacity: 0;
            animation: fadeIn 1.5s forwards;
            animation-delay: 0.7s;
        }

        .footer-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            max-width: 650px;
            margin: 0 auto 24px auto;
            line-height: 1.6;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .footer-links a {
            color: #b493ff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .footer-links a:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .footer-icon {
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .hero { padding-top: 40px; padding-bottom: 32px; }
            .grid { grid-template-columns: 1fr; }
            .footer-links { gap: 24px; flex-wrap: wrap; }
        }
    </style>
</head>
