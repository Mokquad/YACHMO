<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heliotrope</title>
    <style>
        :root {
            --bg-color: #0b0713;
            --card-bg: #160f24;
            --card-hover: #221636;
            --accent-purple: #8b5cf6;
            --text-main: #ffffff;
            --text-muted: #a78bfa;
            --text-desc: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* хиро секция */
        .hero {
            text-align: center;
            padding: 80px 20px 40px 20px;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #b493ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-desc);
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin-bottom: 60px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(139, 92, 246, 0.1);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-6px);
            background-color: var(--card-hover);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 20px 40px rgba(11, 7, 19, 0.5), 0 0 30px rgba(139, 92, 246, 0.15);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .icon-wrapper {
            background: rgba(139, 92, 246, 0.1);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            transition: background 0.3s ease;
        }

        .card:hover .icon-wrapper {
            background: rgba(139, 92, 246, 0.2);
        }

        .arrow-icon {
            color: var(--text-desc);
            transition: all 0.3s ease;
        }

        .card:hover .arrow-icon {
            color: var(--accent-purple);
            transform: translateX(4px);
        }

        .card-content h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .card-content p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-desc);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 40px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            border-left: 4px solid var(--accent-purple);
            padding-left: 12px;
        }

        .stats-banner {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: linear-gradient(90deg, #160f24 0%, #1e1336 100%);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 16px;
            padding: 30px;
            margin-top: 20px;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item h3 {
            font-size: 2rem;
            color: var(--accent-purple);
            margin-bottom: 4px;
        }

        .stat-item p {
            font-size: 0.9rem;
            color: var(--text-desc);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        footer {
            margin-top: auto;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #08050e;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-desc);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent-purple);
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
